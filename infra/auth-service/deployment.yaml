apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: aomeitinose/cvhub.auth-service:latest
          ports:
            - containerPort: 9090
          env:
            - name: ENV
              value: "production"
