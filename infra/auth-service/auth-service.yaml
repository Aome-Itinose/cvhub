apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cvhub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aome-Itinose/cvhub.git
    targetRevision: master
    path: infra/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
